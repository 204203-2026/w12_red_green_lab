name: Grade w12_red_green_lab
on:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Initialize and recompute results
        run: |
          bash init.sh || echo "init failed; continuing to report missing checks"
          bash check.sh
          cat results/report.json
      - name: Commit authoritative results
        if: always()
        run: |
          git add results/report.json results/challenge_report.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "CI: sync authoritative grading results [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Enforce required checks
        if: always()
        run: python3 grader/gate.py
